name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-build:
    name: test & build (reproducible artifacts)
    runs-on: ubuntu-latest
    strategy:
      # Legacy recovery fixtures use zstdCompressSync (Node >= 22.15).
      matrix:
        node: [ '22', '24' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:package
      # Release blocker: committed generated artifacts must match this build.
      - name: Assert generated artifacts match source
        run: git diff --exit-code
